services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    working_dir: /workspace
    ports:
      - "5173:5173"
    depends_on:
      php:
        condition: service_started

  php:
    build:
      context: ..
      dockerfile: .devcontainer/php/Dockerfile
    volumes:
      - ..:/var/www/project:cached
    working_dir: /var/www/project
    expose:
      - "80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-react_app}
      DB_USERNAME: ${DB_USERNAME:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .devcontainer/.env}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.4
    restart: unless-stopped
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .devcontainer/.env}
      MYSQL_DATABASE: ${DB_DATABASE:-react_app}
      MYSQL_USER: ${DB_USERNAME:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .devcontainer/.env}
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pma:
    image: phpmyadmin:5.0
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:80"

volumes:
  mariadb-data:
